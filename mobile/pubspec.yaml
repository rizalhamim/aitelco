name: bizplan_java_agent
description: "Bizplan Java Agent — IOH Java telco analytics AI (Android client)."
publish_to: 'none'
version: 1.44.0+50

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.4
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.19.0
  fl_chart: ^0.69.2
  cupertino_icons: ^1.0.8
  package_info_plus: ^8.0.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.10.0
  lucide_icons_flutter: ^4.0.1
  device_info_plus: ^11.3.0
  speech_to_text: ^7.4.0
  pdf: ^3.11.3
  archive: ^4.0.9
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/geo/
    - assets/img/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Prompt-Medium.ttf
          weight: 500
