<template id="notes">
<li>Satu pintu analisis: tombol Kenapa? muncul di kartu KPI, baris alert, kartu Brief Pagi, dan grafik jawaban, hanya jika perubahannya melewati ambang.</li>
<li>Jawaban singkat dulu (angka dan dua penyebab terbesar), detail di bawahnya.</li>
<li>Waterfall per kabupaten selalu berjumlah sama dengan perubahan region; "Lainnya" tetap tampil, skala yang tidak dari nol ditandai patahan.</li>
<li>Efek volume (RGU), rate (revenue per RGU), dan mix menjawab apakah masalahnya jumlah pelanggan, harga, atau komposisi paket.</li>
<li>Pohon telusur region, kabupaten, kecamatan, site dengan jalur terbesar ditandai.</li>
